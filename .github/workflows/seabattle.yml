name: Sea Battle

# A visitor clicks a tile -> opens an issue "seabattle|fire|B4" -> this fires the shot.
on:
  issues:
    types: [opened]
  workflow_dispatch:

# One run at a time. Each run handles every open move issue, so a run that GitHub
# drops from the queue loses nothing: the next one picks those moves up.
concurrency:
  group: seabattle
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fire:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'seabattle')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fire the cannons
        env:
          SEABATTLE_SECRET: ${{ secrets.SEABATTLE_SECRET }}
        run: python3 seabattle/game.py apply

      - name: Update the board
        run: |
          git config user.name "sea-battle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md seabattle/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Sea Battle: game update"
            git push
          fi

      - name: Reply to the captains
        run: python3 seabattle/game.py notify
